name: Validacao Windows original Flow Tutum Next

on:
  pull_request:
    paths:
      - 'flow-tutum-next/windows-original/**'
      - '.github/workflows/flow-tutum-next-windows.yml'
  push:
    branches:
      - feat/flow-tutum-next-core-fullstack
    paths:
      - 'flow-tutum-next/windows-original/**'
      - '.github/workflows/flow-tutum-next-windows.yml'

jobs:
  windows-original:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flow-tutum-next/windows-original
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript do painel
        run: |
          node --check web/app.js
          node --check web/enhancements.js
      - name: Compilar servidor Windows original
        run: dotnet build src/FlowTutum.Next.csproj -c Release --warnaserror
      - name: Validar geometria e monitor ultrawide
        run: dotnet run --project tests/FlowTutum.Geometry.Tests.csproj -c Release
      - name: Validar ABI de entrada e teclado Windows
        run: dotnet run --project tests/FlowTutum.Input.Tests.csproj -c Release
      - name: Testar HTTP e origem WebSocket com servidor Next isolado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FLOW_TUTUM_NEXT_PORT = '49981'
          $env:FLOW_TUTUM_NEXT_LAN = '0'
          $env:FLOW_TUTUM_NEXT_TAILNET = '0'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'flow-next-integration-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'flow-next-test-stdout.log'
          $server = Start-Process dotnet -ArgumentList @('run','--project','src/FlowTutum.Next.csproj','--no-build','--configuration','Release') -WorkingDirectory (Get-Location).Path -PassThru -WindowStyle Hidden -RedirectStandardOutput $log
          try {
            node tests/ws-origin-integration.mjs
            if ($LASTEXITCODE -ne 0) { throw "Falha no teste de WebSocket: $LASTEXITCODE" }
            node tests/ws-auth-deadline-integration.mjs
            if ($LASTEXITCODE -ne 0) { throw "Falha no deadline de autenticacao WS: $LASTEXITCODE" }
            node tests/ws-payload-integration.mjs
            if ($LASTEXITCODE -ne 0) { throw "Falha na validacao de payload WS: $LASTEXITCODE" }
            $pin = $null
            for ($i=0; $i -lt 40; $i++) {
              $text = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
              if ($text -match 'Codigo temporario de pareamento: (\d{6})') { $pin = $Matches[1]; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $pin) { throw 'PIN do servidor isolado indisponivel' }
            $env:FLOW_TUTUM_TEST_PIN = $pin
            node tests/ws-replacement-integration.mjs
            if ($LASTEXITCODE -ne 0) { throw "Falha no teste de substituicao WS: $LASTEXITCODE" }
            Remove-Item Env:FLOW_TUTUM_TEST_PIN -ErrorAction SilentlyContinue
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
