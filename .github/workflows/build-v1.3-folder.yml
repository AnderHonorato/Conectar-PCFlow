name: Build PCFlow V1.3 Folder

on:
  push:
    branches: ["feat/pcflow-v1.3-folder"]
  workflow_dispatch:

jobs:
  windows-v13:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restaurar V1.3
        run: dotnet restore PCFlow-v1.3.0/PCFlow.sln
      - name: Compilar V1.3
        run: dotnet build PCFlow-v1.3.0/PCFlow.sln -c Release --no-restore
      - name: Publicar EXE V1.3
        run: dotnet publish PCFlow-v1.3.0/windows/PCFlow.Windows/PCFlow.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/v1.3/windows
      - name: Nome final
        shell: pwsh
        run: Copy-Item release/v1.3/windows/PCFlow.exe release/PCFlow-v1.3.0-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PCFlow-v1.3.0-Windows
          path: release/PCFlow-v1.3.0-Windows.exe
          if-no-files-found: error

  android-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Testar Android V1.3
        run: gradle -p PCFlow-v1.3.0/android :app:testDebugUnitTest --stacktrace
      - name: Compilar APK V1.3
        run: gradle -p PCFlow-v1.3.0/android :app:assembleDebug --stacktrace
      - name: Nome final
        run: cp PCFlow-v1.3.0/android/app/build/outputs/apk/debug/app-debug.apk PCFlow-v1.3.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCFlow-v1.3.0-Android
          path: PCFlow-v1.3.0-Android.apk
          if-no-files-found: error
